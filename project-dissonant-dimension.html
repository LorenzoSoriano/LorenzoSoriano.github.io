<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Dissonant Dimension production and game design case study by Lorenzo Soriano.">
  <title>Dissonant Dimension — Lorenzo Soriano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/core/styles.css?v=4">
  <link rel="stylesheet" href="assets/css/core/refinements.css">
  <link rel="stylesheet" href="assets/css/core/portfolio-expanded.css?v=1">

  <link rel="stylesheet" href="assets/css/projects/dissonant/dissonant.css?v=1">

<body data-page="dissonant">
  <header class="site-header">
    <a class="brand" href="index.html">LS<span>.</span></a>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">Menu</button>
    <nav class="nav">
      <a href="index.html">Home</a>
      <div class="lang-switch"><button data-lang="it">IT</button><span>/</span><button data-lang="en">EN</button></div>
    </nav>
  </header>

  <main class="page-main">
    <section class="page-intro section-shell case-hero dd-hero">
      <div class="case-hero-copy reveal">
        <p class="page-label" data-i18n="dissonant.label"></p>
        <h1 data-i18n="dissonant.title"></h1>
        <p data-i18n="dissonant.intro"></p>
        <p class="dd-status"><span aria-hidden="true"></span><strong data-i18n="dissonant.status">Case study in development</strong></p>
      </div>

      <div class="case-visual dd-hero-visual reveal" aria-hidden="true">
        <div class="dd-dimension dd-dimension--a">
          <span class="dd-dimension__label" data-i18n="dissonant.dimensionA">Dimension A</span>
          <span class="dd-platform dd-platform--one"></span>
          <span class="dd-platform dd-platform--two"></span>
        </div>
        <div class="dd-dimension dd-dimension--b">
          <span class="dd-dimension__label" data-i18n="dissonant.dimensionB">Dimension B</span>
          <span class="dd-platform dd-platform--one"></span>
          <span class="dd-platform dd-platform--two"></span>
        </div>
        <span class="dd-player"></span>
        <span class="dd-shift" data-i18n="dissonant.shift">SHIFT</span>
      </div>
    </section>

    <section class="section-shell project-facts-section">
      <div class="project-facts reveal">
        <article class="project-fact"><span class="project-fact__label" data-i18n="facts.focus"></span><strong data-i18n="dissonant.focus"></strong></article>
        <article class="project-fact"><span class="project-fact__label" data-i18n="facts.context"></span><strong data-i18n="dissonant.context"></strong></article>
        <article class="project-fact"><span class="project-fact__label" data-i18n="facts.genre"></span><strong data-i18n="dissonant.type"></strong></article>
        <article class="project-fact"><span class="project-fact__label" data-i18n="facts.budget"></span><strong data-i18n="facts.dissonantBudget"></strong></article>
        <article class="project-fact"><span class="project-fact__label" data-i18n="facts.timeline"></span><strong data-i18n="facts.dissonantTimeline"></strong></article>
        <article class="project-fact"><span class="project-fact__label" data-i18n="facts.price"></span><strong data-i18n="facts.dissonantPrice"></strong></article>
      </div>
    </section>

    <section class="section-shell section-block dd-development reveal">
      <div class="dd-development__heading">
        <p class="page-label" data-i18n="dissonant.developmentLabel">CURRENT STATUS</p>
        <h2 data-i18n="dissonant.developmentTitle">The project structure is defined. The visual case study is still being developed.</h2>
      </div>
      <div class="dd-development__items">
        <article><span class="dd-development__dot"></span><div><h3 data-i18n="dissonant.definedTitle">Already defined</h3><p data-i18n="dissonant.definedDesc"></p></div></article>
        <article><span class="dd-development__dot dd-development__dot--next"></span><div><h3 data-i18n="dissonant.nextTitle">Next page update</h3><p data-i18n="dissonant.nextDesc"></p></div></article>
      </div>
    </section>

    <section class="section-shell section-block">
      <div class="case-overview">
        <div class="reveal"><p class="page-label" data-i18n="case.overview"></p><h2 data-i18n="dissonant.overviewTitle"></h2></div>
        <div class="case-copy reveal"><p data-i18n="dissonant.overview1"></p><p data-i18n="dissonant.overview2"></p></div>
      </div>
    </section>

    <section class="section-shell section-block">
      <div class="category-projects-heading reveal"><p class="page-label" data-i18n="case.systems"></p></div>
      <div class="case-system-grid dd-system-list">
        <article class="case-system reveal"><p class="eyebrow" data-i18n="dissonant.system1Label">SPACE</p><div><h3 data-i18n="dissonant.s1"></h3><p data-i18n="dissonant.s1d"></p></div></article>
        <article class="case-system reveal"><p class="eyebrow" data-i18n="dissonant.system2Label">MOVEMENT</p><div><h3 data-i18n="dissonant.s2"></h3><p data-i18n="dissonant.s2d"></p></div></article>
        <article class="case-system reveal"><p class="eyebrow" data-i18n="dissonant.system3Label">PRODUCTION</p><div><h3 data-i18n="dissonant.s3"></h3><p data-i18n="dissonant.s3d"></p></div></article>
      </div>
    </section>

    <section class="section-shell section-block">
      <div class="case-callout reveal"><h3 data-i18n="dissonant.callTitle"></h3><p data-i18n="dissonant.callDesc"></p></div>
      <div class="related-links"><a class="button ghost" href="game-production.html" data-i18n="case.backProduction">Back to Game Production &amp; Communication</a></div>
    </section>
  </main>

  <footer class="footer section-shell"><span>© <span id="year"></span> Lorenzo Soriano</span></footer>
